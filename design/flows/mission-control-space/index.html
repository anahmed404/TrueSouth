<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space-first flow</title>
<meta name="description" content="Mission Control, space-first: the camera moves between the five scene views; Compare is a floating window.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* C2 neutrals. Boxes are places, arrows are what the user does. */
:root{color-scheme:dark;--bg:#0b0b0c;--surface:#141415;--raised:#1b1b1d;--line:#262629;--line-strong:#37373b;--ink:#ececee;--ink-2:#b3b3b8;--ink-3:#8c8c93;--accent:#f3efe6;--sun:#ffe2a0;--earth:#6cc4ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font:400 13px/1.4 "Jost","Futura","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}
svg{display:block;width:100%;max-width:1440px;height:auto;margin:0 auto}
text{font-family:inherit}
.ttl{font-size:18px;font-weight:600;fill:var(--ink)}
.sub{font-size:13px;fill:var(--ink-2)}
.bt{font-size:15px;font-weight:600;fill:var(--ink)}
.bb{font-size:12px;fill:var(--ink-2)}
.al{font-size:12px;fill:var(--ink)}
.al2{font-size:12px;fill:var(--ink-2)}
.sec{font-size:13px;font-weight:600;fill:var(--ink-3)}
</style>
</head>
<body>
<svg id="flow" viewBox="0 0 1440 900" role="img" aria-label="Space-first Mission Control flow: the System view is home; the camera flies to the Polar map, the Slip Planner, Local terrain and Lander's eye; Compare opens as a floating window."></svg>
<script>
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('flow');
const S = (t, a, p = svg, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; p.appendChild(e); return e; };
const defs = S('defs', {});
for (const [id, col] of [['ar', '#b3b3b8'], ['ar2', '#5c5c63'], ['ac', '#f3efe6']]) {
  const m = S('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  S('path', { d: 'M0,1 L9,5 L0,9 z', fill: col }, m);
}
const Lines = S('g', {}), Boxes = S('g', {}), Labels = S('g', {});
S('text', { x: 32, y: 44, class: 'ttl' }, svg, 'Mission Control, space-first: how you move');
S('text', { x: 32, y: 68, class: 'sub' }, svg, 'The 3D scene is always behind the interface. Picking a view moves the camera, the Slip Planner included; Compare opens as a floating window over whatever view you are on.');

function box(x, y, w, h, title, lines, kind = 'view') {
  const st = { home: ['#1b1b1d', '#f3efe6', 1.6, ''], view: ['#141415', '#37373b', 1.2, ''], win: ['#141415', '#8c8c93', 1.2, '5 4'], note: ['#0e0e0f', '#262629', 1, ''] }[kind];
  S('rect', { x, y, width: w, height: h, rx: 14, fill: st[0], stroke: st[1], 'stroke-width': st[2], 'stroke-dasharray': st[3] }, Boxes);
  S('text', { x: x + 16, y: y + 26, class: 'bt' }, Boxes, title);
  lines.forEach((l, i) => S('text', { x: x + 16, y: y + 46 + i * 17, class: 'bb' }, Boxes, l));
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
}
function arrow(pts, label, opts = {}) {
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join('');
  S('path', { d, fill: 'none', stroke: opts.auto ? '#5c5c63' : opts.cam ? '#f3efe6' : '#b3b3b8', 'stroke-width': opts.cam ? 1.8 : 1.3, 'stroke-dasharray': opts.auto ? '5 4' : '', 'marker-end': `url(#${opts.auto ? 'ar2' : opts.cam ? 'ac' : 'ar'})` }, Lines);
  if (label) {
    const [lx, ly] = opts.at || pts[Math.floor(pts.length / 2)];
    const g = S('g', {}, Labels);
    const ls = Array.isArray(label) ? label : [label];
    ls.forEach((t, i) => S('text', { x: lx, y: ly + i * 15, class: i ? 'al2' : 'al', 'text-anchor': opts.anchor || 'middle' }, g, t));
    const bb = g.getBBox(); g.insertBefore(S('rect', { x: bb.x - 6, y: bb.y - 3, width: bb.width + 12, height: bb.height + 6, rx: 6, fill: '#0b0b0c' }), g.firstChild);
  }
}

// the five scene views, as a camera path from far to near
const W5 = 236, G5 = (1330 - 5 * W5) / 4, X5 = i => 64 + i * (W5 + G5);
const sys = box(X5(0), 140, W5, 176, 'System view (home)', ['Sun, Earth and Moon fill the', 'window. Pins on the selected', 'sites; sight-lines from the', 'focused site, from the series.', 'Every direction is true.'], 'home');
const pol = box(X5(1), 140, W5, 176, 'Polar map', ['The camera flies under the', 'south pole, then the flat map', 'takes the background. Overlays,', 'nudge a pin, click the ground', 'to place a site.']);
const slp = box(X5(2), 140, W5, 176, 'Slip Planner', ['The camera stops over the pole,', 'tilted so the Moon curves away.', 'A spot per site says its status', 'for the landing date below.', 'Ground lit by a fixed light.']);
const ter = box(X5(3), 140, W5, 176, 'Local terrain', ['The camera descends to the', 'site: 20 km of 80 m ground in', 'the land around it, out to the', 'horizon.']);
const eye = box(X5(4), 140, W5, 176, "Lander's eye", ['The camera drops to 2 m and', 'looks along the horizon. Earth', 'and the Sun at true size; the', '×12 horizon chart floats below.']);
const gapMid = (a, b) => (a.r + b.x) / 2;
arrow([[sys.r, 228], [pol.x, 228]], ['fly', '1.3 s'], { cam: true, at: [gapMid(sys, pol), 204] });
arrow([[pol.r, 228], [slp.x, 228]], ['tilt', '1.4 s'], { cam: true, at: [gapMid(pol, slp), 204] });
arrow([[slp.r, 228], [ter.x, 228]], ['descend', '1.5 s'], { cam: true, at: [gapMid(slp, ter), 204] });
arrow([[ter.r, 228], [eye.x, 228]], ['drop', '1.3 s'], { cam: true, at: [gapMid(ter, eye), 204] });
arrow([[ter.cx, ter.y], [ter.cx, 112], [sys.cx - 40, 112], [sys.cx - 40, sys.y]], ['Any view to any view: one eased move, interrupted by a drag or another pick'], { cam: true, at: [560, 116] });

// the Slip Planner's own loop
S('text', { x: 64, y: 360, class: 'sec' }, svg, 'In the Slip Planner: the bottom panel shows landing dates, not hours');
const dates = box(X5(0), 376, 2 * W5 + G5, 150, 'Landing dates (bottom panel)', ['One strip per site over six years, and an "Any site" line.', 'GO full height, CAUTION half, NO-GO a low red line.', 'Drag the Moonlight slider, press ← → (Shift: a week),', 'or Slip +7 d / +14 d in the app bar. 3 months, 18 months,', '6 years. Hover or focus a strip for status and why.']);
const spots = box(X5(2), 376, W5, 150, 'Spots change live', ['Every spot, the sites panel,', 'the focused-site panel and the', 'strips read one function, so', 'they always agree.']);
const ba = box(X5(3), 376, 2 * W5 + G5, 150, 'Before and after', ['After a slip: "Slipped +21 d, 01 Mar → 22 Mar 2028.', '4 of 5 sites changed. Best now: Mons Mouton."', 'Changed spots say "was CAUTION"; a dashed line marks', 'the old date on the strips. The cross clears it.'], 'note');
arrow([[dates.r, 451], [spots.x, 451]], ['date', 'moves'], { auto: true, at: [gapMid(dates, spots), 426] });
arrow([[spots.r, 451], [ba.x, 451]], ['compare', 'with before'], { auto: true, at: [gapMid(spots, ba), 426] });
arrow([[slp.cx, slp.b], [slp.cx, spots.y]], null, { cam: true });

// windows, the clock and the panels
S('text', { x: 64, y: 566, class: 'sec' }, svg, 'One floating window, one clock, and the floating panels');
const W4 = 284, G4 = (1330 - 4 * W4) / 3, X4 = i => 64 + i * (W4 + G4);
const cmp = box(X4(0), 582, W4, 150, 'Compare (window)', ['Up to four sites in matching columns', 'for the same landing date. Opens over', 'any view; the camera stays. Escape', 'closes it and returns focus.'], 'win');
const tl = box(X4(1), 582, W4, 150, 'Timeline (bottom, other views)', ['The hours of one mission window.', 'Drag the scrubber, press ← and →, or', 'play: the Sun and Earth move, sight-', 'lines and countdowns update.']);
const panels = box(X4(2), 582, W4, 150, 'Floating panels', ['Sites (left), focused site (right),', 'bottom panel. Each folds with its own', 'button, or [ and ]; the camera', 're-centres on the free space.']);
const pick = box(X4(3), 582, W4, 150, 'Focus a site', ['From the sites panel, a spot or pin,', 'a strip, the map or a Compare column.', 'In the Slip Planner the camera stays;', 'the right panel shows that site.']);
arrow([[tl.r, 657], [panels.x, 657]], ['all views,', 'one moment'], { auto: true, at: [gapMid(tl, panels), 630] });
arrow([[panels.r, 657], [pick.x, 657]], ['click', 'a site'], { at: [gapMid(panels, pick), 630] });

// other devices
S('text', { x: 64, y: 776, class: 'sec' }, svg, 'Phone and slow devices');
S('text', { x: 64, y: 796, class: 'sub' }, svg, 'Phone: the view bar scrolls, the focused site is a sheet, the landing dates fill the bottom; drag anywhere on the strips. Compare opens full screen.');
S('text', { x: 64, y: 818, class: 'sub' }, svg, 'No WebGL, or 3D too slow: the Slip Planner shows the same spots on the flat Polar map; other views show a still picture. Reduce motion: every camera move is a 120 ms dip.');
S('text', { x: 64, y: 850, class: 'sub' }, svg, 'Prototype: design/variants/space-first/index.html (Design options: spot variant a or b, or the earlier floating-window grid). Notes: design/variants/c2-slip-on-moon.md.');
</script>
</body>
</html>
