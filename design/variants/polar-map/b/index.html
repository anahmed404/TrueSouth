<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polar map · b</title>
<!-- Direction C2 prototype, generated: shared shell + one view. Mock data. Open at 1440 × 900. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Direction C2 tokens (see design/variants/direction-c2.md). Same block on every C2 page. ── */
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#141415; --raised:#1b1b1d; --hover:#232326;
  --line:#262629; --line-strong:#37373b;
  --ink:#ececee; --ink-2:#b3b3b8; --ink-3:#8c8c93; --ink-4:#5c5c63;
  --accent:#f3efe6; --accent-ink:#141414;
  --sun:#ffe2a0; --sun-core:#fff4d8; --earth:#6cc4ff; --earth-core:#9fdbff;
  --status-go:#45c98b; --status-caution:#f2a33a; --status-nogo:#f0646d;
  --plot:#0e0e0f; --terrain:#1d1d20; --terrain-rim:#a8a8af; --grid:rgba(255,255,255,.06);
  --font:"Jost","Futura","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --t-xs:11px; --t-sm:12px; --t-md:13px; --t-lg:15px; --t-xl:18px; --t-2xl:24px; --t-3xl:32px; --t-display:44px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  /* proposed for the collapsible shell (see c2-views.md) */
  --rail-w:256px; --focus-w:328px; --mini-w:48px; --dur-panel:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none;background:var(--bg)}
html::-webkit-scrollbar{display:none}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.4;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:var(--accent-ink)}
button,summary{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.unit{font-size:.7em;color:var(--ink-2);font-weight:400;margin-left:1px}
.sub{color:var(--ink-2)} .lbl{color:var(--ink-3)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
text{font-family:var(--font)}

.tag{display:inline-flex;align-items:center;gap:2px;height:17px;padding:0 6px;border-radius:var(--r-pill);
  font-size:var(--t-sm);font-weight:400;color:var(--ink-3);white-space:nowrap;vertical-align:1px;line-height:1}
.tag.src{border:1px solid var(--line-strong)} .tag.src::after{content:"↗"}
.tag.asm{border:1px dashed var(--line-strong)}

.lamp{--c:var(--status-go);width:16px;height:16px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;flex:none}
.lamp svg{width:11px;height:11px;stroke:#0b0b0c;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.go{--c:var(--status-go)} .caution{--c:var(--status-caution)} .nogo{--c:var(--status-nogo)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c)}

/* ── page: frames stacked, each one a 1440 × 900 shell ── */
.frame{width:1440px;height:900px;margin:0 auto;position:relative}
.between{width:1440px;margin:0 auto;padding:28px 24px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:var(--s4);background:var(--bg)}
.between h2{font-size:var(--t-xl);font-weight:600;white-space:nowrap}
.between p{font-size:var(--t-lg);color:var(--ink-2);max-width:96ch}
.between kbd,.foot kbd{font:inherit;font-size:var(--t-sm);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 5px;color:var(--ink-2)}

/* ── shell grid: docked, nothing floats over the main view; side panels collapse to a 48 px strip ── */
.app{width:1440px;height:900px;padding:0 8px;display:grid;
  grid-template-columns:var(--rail-w) minmax(0,1fr) var(--focus-w);column-gap:8px;grid-template-rows:52px 620px 8px 196px 24px;
  }
.app.lc{grid-template-columns:var(--mini-w) minmax(0,1fr) var(--focus-w)}
.app.rc{grid-template-columns:var(--rail-w) minmax(0,1fr) var(--mini-w)}
.app.lc.rc{grid-template-columns:var(--mini-w) minmax(0,1fr) var(--mini-w)}
/* the timeline folds to its header row, giving the main view 152 px more height */
.app{transition:grid-template-columns var(--dur-panel) cubic-bezier(.2,.7,.2,1),grid-template-rows var(--dur-panel) cubic-bezier(.2,.7,.2,1)}
.app.tc{grid-template-rows:52px 772px 8px 44px 24px}
.app.tc .strip{padding:var(--s2) var(--s4)}
.app.tc .strip .tl,.app.tc .strip .cards{display:none}
.app.tc [data-act="tc"] svg{transform:rotate(180deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-height:0;min-width:0}

.top{grid-column:1/-1;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s1)}
.brand{display:flex;align-items:center;gap:8px;font-size:var(--t-xl);font-weight:600;margin-right:var(--s2)}
.brand svg{width:22px;height:22px}
.seg{display:flex;padding:2px;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line)}
.seg button{height:28px;padding:0 14px;border-radius:var(--r-pill);font-size:var(--t-md);color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:var(--s2);height:36px;padding:4px 6px 4px 12px;border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line)}
.field .lbl{font-size:var(--t-sm)}
.field .v{font-size:var(--t-lg);font-weight:500}
.field .v small{font-size:var(--t-sm);color:var(--ink-3);font-weight:400}
.ib{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:14px;height:14px}
.btn{height:28px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--t-sm);color:var(--ink-2);border:1px solid var(--line-strong);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--ink);background:var(--hover)}
.btn:disabled{color:var(--ink-4);border-color:var(--line);cursor:not-allowed;background:none}
.btn-lg{height:36px;padding:0 14px;border-radius:var(--r-md);font-size:var(--t-md);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.vr{width:1px;height:20px;background:var(--line-strong)}

/* sites rail */
.rail{grid-column:1;grid-row:2;overflow:hidden}
.rail .open{padding:var(--s4) var(--s2) var(--s2);display:flex;flex-direction:column;height:100%;width:254px}
.rail-h{display:flex;align-items:center;gap:var(--s2);padding:0 0 0 var(--s2)}
.rail-h h2{font-size:var(--t-lg);font-weight:600}
.rail-h span{font-size:var(--t-sm);color:var(--ink-3);margin-left:auto}
.rail-sub{padding:2px var(--s2) var(--s3);font-size:var(--t-sm);color:var(--ink-3)}
.sites{list-style:none;display:flex;flex-direction:column;gap:2px}
.site{display:block;width:100%;text-align:left;padding:10px var(--s2) 10px var(--s3);border-radius:var(--r-md);border:1px solid transparent}
.site:hover{background:var(--raised)}
.site[aria-current="true"]{background:var(--hover);border-color:var(--line-strong)}
.site .nm{font-size:var(--t-lg);font-weight:500;display:block}
.site .ln{display:flex;align-items:center;gap:var(--s2);margin-top:3px;font-size:var(--t-sm);color:var(--ink-2)}
.site .ln.lbl{color:var(--ink-3)}
.site .status{font-size:var(--t-sm)}
.add{margin-top:var(--s2);height:36px;border-radius:var(--r-md);border:1px dashed var(--line-strong);color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-md)}
.add:hover{color:var(--ink);background:var(--raised)}

/* collapsed strips */
.mini{display:none;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s3) 0;height:100%}
.app.lc .rail .open,.app.rc .focus .open{display:none}
.app.lc .rail .mini,.app.rc .focus .mini{display:flex}
.mini .sep{width:24px;height:1px;background:var(--line);margin:2px 0}
.msite{width:36px;height:40px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent}
.msite:hover{background:var(--raised)}
.msite[aria-current="true"]{background:var(--hover);border-color:var(--line-strong)}
.msite b{font-size:var(--t-sm);font-weight:500;color:var(--ink-2);line-height:1}
.madd{width:32px;height:32px;border-radius:var(--r-md);border:1px dashed var(--line-strong);display:grid;place-items:center;color:var(--ink-2)}
.madd:hover{background:var(--raised);color:var(--ink)}
.vtext{writing-mode:vertical-rl;transform:rotate(180deg);font-size:var(--t-sm);color:var(--ink-3);white-space:nowrap;margin-top:auto}
.focus .mini .vtext{margin-top:0;color:var(--ink-2);font-size:var(--t-md)}
.focus .mini .vtext b{color:var(--ink);font-weight:500}
.focus .mini .vtext em{font-style:normal;color:var(--status-nogo);font-weight:500}
.focus .mini .lamp{width:24px;height:24px}
.focus .mini .lamp svg{width:15px;height:15px}

/* main view */
.main{grid-column:2;grid-row:2;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:left;padding:8px 10px 9px;border-radius:var(--r-md) var(--r-md) 0 0;position:relative;color:var(--ink-2)}
.tab:hover{background:var(--raised);color:var(--ink)}
.tab b{display:flex;align-items:center;gap:6px;font-size:var(--t-md);font-weight:500;white-space:nowrap}
.tab span{display:block;font-size:var(--t-sm);color:var(--ink-3);margin-top:1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--raised)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:var(--r-sm);background:var(--accent)}
.d3{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 5px;border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:500;font-style:normal;color:var(--ink-2);background:var(--hover);border:1px solid var(--line-strong)}
.d3 svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round}
.vbody{padding:var(--s4) var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-height:0;flex:1}
.what{font-size:var(--t-lg);line-height:1.45;color:var(--ink);max-width:100ch;text-wrap:pretty}
.vctl{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-sm);color:var(--ink-3);flex-wrap:nowrap;white-space:nowrap;min-height:28px}
.mseg{display:flex;padding:3px;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line)}
.mseg button{height:22px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.mseg button:hover{color:var(--ink)}
.mseg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.toggle i{width:26px;height:16px;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line-strong);position:relative;flex:none}
.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-3);transition:transform .15s ease-out}
.toggle[aria-pressed="true"] i{background:var(--hover);border-color:var(--ink-3)}
.toggle[aria-pressed="true"] i::after{transform:translateX(10px);background:var(--accent)}
.plotbox{flex:1;min-height:0;position:relative;border-radius:var(--r-md);background:var(--plot);border:1px solid var(--line);overflow:hidden}
.plotbox>svg,.plotbox>canvas{position:absolute;inset:0;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px var(--s4);font-size:var(--t-sm);color:var(--ink-3);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.card{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line)}
.card h3{font-size:var(--t-md);font-weight:600}
.card p{font-size:var(--t-md);color:var(--ink-2)}
.pop{position:absolute;z-index:3;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);font-size:var(--t-sm);color:var(--ink-2);pointer-events:none;min-width:200px}
.pop h4{font-size:var(--t-md);font-weight:600;color:var(--ink);margin-bottom:4px}
.pop .status{font-size:var(--t-md)}
.pop dl{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin-top:6px}
.pop dt{color:var(--ink-3)} .pop dd{color:var(--ink);text-align:right;font-weight:500}
.pop dd.bad{color:var(--status-nogo)}
.inplot{position:absolute;z-index:2;font-size:var(--t-sm);color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line-strong);font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.zoomer{display:flex;flex-direction:column;border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line-strong);overflow:hidden}
.zoomer button{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.zoomer button+button{border-top:1px solid var(--line)}
.zoomer button:hover{background:var(--hover);color:var(--ink)}

/* focused-site panel */
.focus{grid-column:3;grid-row:2;overflow:hidden}
.focus .open{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);overflow:auto;height:100%;width:326px}
.f-h{display:grid;grid-template-columns:1fr auto;gap:0 var(--s2);align-items:start}
.f-h p{grid-column:1/-1}
.f-h h2{font-size:var(--t-xl);font-weight:600;line-height:1.2}
.f-h p{font-size:var(--t-sm);color:var(--ink-3);margin-top:2px}
.verdict{padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line)}
.verdict .status{font-size:var(--t-2xl);gap:10px;line-height:1}
.verdict .status .lamp{width:24px;height:24px}
.verdict .status .lamp svg{width:15px;height:15px}
.verdict p{font-size:var(--t-md);color:var(--ink-2);margin-top:var(--s2)}
.verdict p s{color:var(--ink-3)}
.h3{font-size:var(--t-sm);color:var(--ink-3);font-weight:400;margin-bottom:6px}
.broken{padding:var(--s3) var(--s4) 14px;border-radius:var(--r-md);border:1px solid color-mix(in oklab,var(--status-nogo),transparent 55%)}
.broken .row{display:flex;align-items:baseline;justify-content:space-between}
.broken .t{font-size:var(--t-lg);font-weight:500;display:flex;align-items:center;gap:8px}
.broken .m{font-size:var(--t-2xl);font-weight:500;color:var(--status-nogo);line-height:1}
.broken .l{font-size:var(--t-sm);color:var(--ink-2);margin-top:2px}
.meter{height:6px;border-radius:var(--r-pill);background:var(--hover);position:relative;margin-top:10px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:var(--r-pill);background:var(--status-nogo)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:var(--r-sm)}
.meter-k{display:flex;justify-content:space-between;font-size:var(--t-sm);color:var(--ink-3);margin-top:5px}
.passes{list-style:none;display:flex;flex-direction:column;gap:6px}
.passes li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:var(--t-md);color:var(--ink-2)}
.passes li b{color:var(--ink);font-weight:500}
.passes svg{width:14px;height:14px;stroke:var(--status-go);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.passes li.na svg{stroke:var(--ink-3)}
details{border-top:1px solid var(--line);padding-top:var(--s3)}
details summary{list-style:none;display:flex;align-items:center;gap:8px;font-size:var(--t-md);font-weight:500}
details summary::-webkit-details-marker{display:none}
details summary .chev{width:14px;height:14px;transition:transform .15s ease-out}
details[open] summary .chev{transform:rotate(90deg)}
details summary small{margin-left:auto;font-size:var(--t-sm);color:var(--ink-3);font-weight:400}
.links{margin-top:auto;display:flex;gap:var(--s4);font-size:var(--t-sm)}
.links a{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.links a:hover{color:var(--ink)}

/* timeline strip */
.strip{grid-column:1/-1;grid-row:4;display:grid;grid-template-columns:1fr auto;gap:var(--s4);padding:var(--s3) var(--s4)}
.tl-h{display:flex;align-items:center;gap:var(--s3);height:28px;white-space:nowrap}
.tl-h h2{font-size:var(--t-lg);font-weight:600}
.tl-h .win{font-size:var(--t-sm);color:var(--ink-2)}
.tl-h .ctl{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.play{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play svg{width:10px;height:10px;fill:var(--accent-ink)}
.tl{display:block;margin-top:4px}
.cards{display:flex;gap:var(--s2)}
.cd{width:184px;border-radius:var(--r-md);padding:var(--s3) 14px;background:var(--raised);border:1px solid var(--line);display:flex;flex-direction:column}
.cd.warn{border-color:var(--status-caution)}
.cd .hd{display:flex;align-items:center;gap:6px;font-size:var(--t-md);font-weight:500}
.cd .state{margin-left:auto;font-size:var(--t-sm);font-weight:400;color:var(--ink-2)}
.cd .ev{font-size:var(--t-sm);color:var(--ink-2);margin-top:var(--s2)}
.cd .cnt{font-size:var(--t-2xl);font-weight:500;line-height:1.1}
.cd .cnt small{font-size:var(--t-md);color:var(--ink-2);font-weight:400;margin:0 4px 0 1px}
.cd.warn .cnt{color:var(--status-caution)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-sm);font-weight:500;color:var(--status-caution);margin-top:2px}
.flag .lamp{width:13px;height:13px}
.flag .lamp svg{width:9px;height:9px}
.cd .vals{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:var(--t-sm);color:var(--ink-3)}
.cd .vals b{display:block;font-size:var(--t-md);color:var(--ink);font-weight:500}

.foot{grid-column:1/-1;grid-row:5;display:flex;align-items:center;justify-content:center;position:relative;font-size:var(--t-sm);color:var(--ink-3)}
.proto{position:absolute;left:8px;font-size:var(--t-sm);color:var(--ink-3);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:0 8px;line-height:16px}
.foot .more{position:absolute;right:8px;display:flex;align-items:center;gap:6px}

@media (prefers-reduced-motion:reduce){.app{transition:none}}

/* polar map */
input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:16px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:var(--r-pill);background:var(--hover)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
input[type=range]::-moz-range-track{height:4px;border-radius:var(--r-pill);background:var(--hover)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
.plotbox.map{cursor:crosshair;touch-action:none}
.mapzoom{position:absolute;right:12px;bottom:12px;z-index:2}
.readout{position:absolute;left:12px;top:12px;z-index:2;display:flex;gap:10px;align-items:center;height:26px;padding:0 10px;border-radius:var(--r-pill);
  background:color-mix(in oklab,var(--plot),transparent 12%);border:1px solid var(--line-strong);font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.readout b{color:var(--ink);font-weight:500}
.pop.live{pointer-events:auto;min-width:230px}
.pop.live .row{display:flex;gap:8px;margin-top:10px}
.pop.live p{margin-top:2px}
.nudge{display:flex;align-items:center;gap:var(--s4);padding:10px var(--s4);border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line);min-height:52px;white-space:nowrap}
.nudge h3{font-size:var(--t-md);font-weight:600}
.nudge .lbl{font-size:var(--t-sm)}
.nudge .big{font-size:var(--t-xl);font-weight:500;color:var(--ink)}
.nudge .big .fr{color:var(--ink-3);font-weight:400}
.nudge .dn{color:var(--status-nogo)} .nudge .up{color:var(--status-go)}
.ramp{display:inline-block;width:54px;height:8px;border-radius:var(--r-pill);border:1px solid var(--line-strong)}
.offmap{display:inline-flex;align-items:center;gap:8px}
.offmap svg{flex:none}
/* variant b: docked column inside the main view */
.mrow{flex:1;min-height:0;display:flex;gap:var(--s3)}
.mcol{width:252px;flex:none;display:flex;flex-direction:column;gap:var(--s2);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.mcol section{padding:10px var(--s3);border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line)}
.mcol h3{font-size:var(--t-md);font-weight:600;margin-bottom:6px}
.mcol p{font-size:var(--t-sm);color:var(--ink-2)}
.radio{display:flex;align-items:center;gap:8px;width:100%;padding:5px 2px;font-size:var(--t-md);color:var(--ink-2);text-align:left}
.radio i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center}
.radio[aria-pressed="true"]{color:var(--ink)}
.radio[aria-pressed="true"] i{border-color:var(--accent)}
.radio[aria-pressed="true"] i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.radio .ramp{margin-left:auto}
.check{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:var(--t-md);color:var(--ink-2);width:100%;text-align:left}
.check i{width:14px;height:14px;border-radius:var(--r-sm);border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"]{color:var(--ink)}
.check[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] i::after{content:"";width:7px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:var(--t-md);margin-top:6px}
.kv dt{color:var(--ink-2)} .kv dd{text-align:right;font-weight:500}

</style>

<body>
<div id="root"></div>
<script>
/* ── Shared shell for the C2 Mission Control view prototypes. Mock data throughout. ── */
const NS='http://www.w3.org/2000/svg';
function E(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),ink4:css('--ink-4'),line:css('--line'),lineS:css('--line-strong'),
  sun:css('--sun'),sunCore:css('--sun-core'),earth:css('--earth'),earthCore:css('--earth-core'),
  go:css('--status-go'),caution:css('--status-caution'),nogo:css('--status-nogo'),bg:css('--bg'),plot:css('--plot'),
  surface:css('--surface'),raised:css('--raised'),hover:css('--hover'),terrain:css('--terrain'),rim:css('--terrain-rim'),grid:css('--grid'),accent:css('--accent')};
const wrap=d=>((d+180)%360+360)%360-180;
const D2R=Math.PI/180, R2D=180/Math.PI;
const fmt=(v,n=2)=>v.toFixed(n);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T0=Date.UTC(2026,0,1);
const dayDate=d=>new Date(T0+d*864e5);
const dIso=d=>dayDate(d).toISOString().slice(0,10);
const dShort=d=>{const t=dayDate(d);return String(t.getUTCDate()).padStart(2,'0')+' '+MON[t.getUTCMonth()];};
const dLong=d=>{const t=dayDate(d);return String(t.getUTCDate()).padStart(2,'0')+' '+MON[t.getUTCMonth()]+' '+t.getUTCFullYear();};
const LANDING=790; // 2028-03-01

const SPRITE=`<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-go" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="g-caution" viewBox="0 0 24 24"><path d="M12 5.5v8"/><path d="M12 18.5v.2"/></symbol>
  <symbol id="g-nogo" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="#ffe2a0" stroke="none"/><g stroke="#ffe2a0" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></symbol>
  <symbol id="i-earth" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#6cc4ff" stroke="none"/><path d="M7 9c2 0 2.5 1.5 4 1.5S13 9 14.5 9.5 16 12 18 12M8 15.5c1.5-.5 3 .5 4.5 0" stroke="#0b2a40" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-cube" viewBox="0 0 12 12"><path d="M6 1l4.5 2.5v5L6 11 1.5 8.5v-5z"/><path d="M1.5 3.5L6 6l4.5-2.5M6 6v5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></symbol>

  <symbol id="i-pro" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/><path d="M6.8 6.2L5 8l1.8 1.8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3 8h10"/></symbol>

const lamp=(st,extra='')=>`<span class="lamp ${st} ${extra}"><svg><use href="#g-${st}"/></svg></span>`;
const WORD={go:'GO',caution:'CAUTION',nogo:'NO-GO'};

/* Sites, with each one's status on the landing date 2028-03-01 under im2_athena (same as the approved shell). */
const SITES=[
  {id:'cr', name:'Connecting Ridge', ab:'CR',lat:-89.4555,lon:222.6192,tier:'core80',st:'nogo',fact:'Blackout 31 h'},
  {id:'mal',name:'Malapert Massif',  ab:'Mal',lat:-85.9948,lon:359.7642,tier:'core80',st:'go',fact:'Score 81'},
  {id:'mou',name:'Mons Mouton',      ab:'Mou',lat:-85.4266,lon:31.7428, tier:'core80',st:'caution',fact:'Score 63'},
  {id:'dgr',name:'de Gerlache Rim 2',ab:'dG2',lat:-88.2300,lon:295.3716,tier:'core80',st:'caution',fact:'Score 58'},
  {id:'a11',name:'Apollo 11',        ab:'A11',lat:0.67416,lon:23.47314,tier:'sphere',st:'go',fact:'Score 100',note:'Terrain not modelled'},
];
const SITE=Object.fromEntries(SITES.map(s=>[s.id,s]));

const TABS=[
  ['slip','Slip Planner','Every landing date'],['map','Polar map','Pick and nudge sites'],
  ['sys','System view','Moon, Earth and Sun',1],['ter','Local terrain','The ground at the site',1],

function railItems(o,states){return SITES.map(s=>{const x=(states&&states[s.id])||s;
  return `<li><button class="site" data-site="${s.id}" aria-current="${s.id===o.focus}"><span class="nm">${s.name}</span>
  <span class="ln">${statusHTML(x.st)}${x.fact}</span>${s.note?`<span class="ln lbl">${s.note}</span>`:''}</button></li>`}).join('');}
function railMini(o,states){return SITES.map(s=>{const x=(states&&states[s.id])||s;
  return `<button class="msite" data-site="${s.id}" aria-current="${s.id===o.focus}" title="${s.name}: ${WORD[x.st]}, ${x.fact}" aria-label="${s.name}, ${WORD[x.st]}">${lamp(x.st)}<b>${s.ab}</b></button>`}).join('');}

function focusCR(){return `
    <div class="verdict" role="status">${statusHTML('nogo')}
      <p>One rule is broken, so this landing date fails. Score <s>51</s> is not used.</p></div>
    <section><h3 class="h3">Broken rule</h3>
      <div class="broken">
        <div class="row"><span class="t">${lamp('nogo')}Longest blackout</span><span class="m">31<span class="unit">h</span></span></div>
        <p class="l">Limit 12 h <span class="tag asm">assumed</span>. Earth is out of contact for 31 hours in a row from 09 Mar 17:00 UTC.</p>
        <div class="meter" aria-hidden="true"><i style="width:100%"></i><u style="left:38.7%"></u></div>
        <div class="meter-k"><span>0 h</span><span style="margin-left:24%">limit 12 h</span><span style="margin-left:auto">31 h</span></div>
      </div></section>
    <section><h3 class="h3">Rules that pass</h3>
      <ul class="passes">
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Longest dark <b>4 h</b>, limit 6 h</span><span class="tag asm">assumed</span></li>
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Slope <b>3.1°</b>, limit 10°</span><span class="tag asm">assumed</span></li>
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Lit at landing, disc <b>1.00</b>, needs 0.5</span><span class="tag asm">assumed</span></li>
      </ul></section>
    <details><summary><svg class="i chev" viewBox="0 0 16 16"><use href="#i-chev"/></svg>Mission window metrics<small>8 values, 240 h</small></summary></details>`;}
function focusA11(){return `
    <div class="verdict" role="status">${statusHTML('go')}
      <p>Every rule that could be checked passes. Score 100 is out of power and comms only.</p></div>
    <section><h3 class="h3">Not assessed</h3>
      <ul class="passes">
        <li class="na"><svg viewBox="0 0 24 24"><use href="#i-minus"/></svg><span>Slope not assessed: no terrain data here</span><span></span></li>
        <li class="na"><svg viewBox="0 0 24 24"><use href="#i-minus"/></svg><span>Skyline is flat: the Moon is a smooth sphere</span><span></span></li>
      </ul></section>
    <section><h3 class="h3">Rules that pass</h3>
      <ul class="passes">
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Longest dark <b>0 h</b>, limit 6 h</span><span class="tag asm">assumed</span></li>
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Longest blackout <b>0 h</b>, limit 12 h</span><span class="tag asm">assumed</span></li>
        <li><svg viewBox="0 0 24 24"><use href="#g-go"/></svg><span>Lit at landing, disc <b>1.00</b>, needs 0.5</span><span class="tag asm">assumed</span></li>
      </ul></section>
    <details><summary><svg class="i chev" viewBox="0 0 16 16"><use href="#i-chev"/></svg>Mission window metrics<small>7 values, 240 h</small></summary></details>`;}

function shellHTML(o,V){
  const f=SITE[o.focus], cr=o.focus==='cr';
  const tabs=TABS.map(([k,n,l,d3])=>`<button class="tab" role="tab" aria-selected="${k===V.tab}"><b>${n}${d3?' <i class="d3"><svg><use href="#i-cube"/></svg>3D</i>':''}</b><span>${l}</span></button>`).join('');
  return `<div class="app${o.lc?' lc':''}${o.rc?' rc':''}${o.tc?' tc':''}">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#8c8c93" stroke-width="1.6"/><path d="M16 4 L19 16 L16 28 L13 16Z" fill="#ececee"/><path d="M16 16 L19 16 L16 28Z" fill="#8c8c93"/></svg>TrueSouth</div>
    <nav class="seg" aria-label="Mode"><button aria-pressed="true">Mission Control</button><button aria-pressed="false">Academy</button></nav>
    <div class="spacer"></div>
    <button class="field" aria-label="Mission profile: IM-2 Athena, 10 days"><span class="lbl">Mission profile</span><span class="v">IM-2 Athena</span>
      <span class="sub" style="font-size:var(--t-sm)">10 d</span><span class="tag src">sourced</span>
      <svg class="i" style="width:14px;height:14px;color:var(--ink-3);margin-right:4px" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
    <div class="field">
      <span class="lbl">Landing date</span>
      <button class="ib" data-slip="-1" aria-label="One day earlier"><svg class="i"><use href="#i-l"/></svg></button>
      <span class="v ldate">2028-03-01 00:00 <small>UTC</small></span>
      <button class="ib" data-slip="1" aria-label="One day later"><svg class="i"><use href="#i-r"/></svg></button>
      <span class="vr"></span>
      <button class="btn" data-slip="7">Slip +7 d</button><button class="btn" data-slip="14" style="margin-right:2px">+14 d</button>
    </div>
    <button class="btn-lg btn"><svg class="i" viewBox="0 0 20 20"><circle cx="5" cy="10" r="2.2"/><circle cx="15" cy="4.5" r="2.2"/><circle cx="15" cy="15.5" r="2.2"/><path d="M7 9l6-3.4M7 11l6 3.4"/></svg>Share</button>
  </header>

  <aside class="panel rail" aria-label="Selected sites">
    <div class="open">
      <div class="rail-h"><h2>Selected sites</h2><span>5 of 8</span>
        <button class="ib" data-act="lc" aria-label="Collapse the sites panel" title="Collapse  [ "><svg class="i"><use href="#i-pl"/></svg></button></div>
      <p class="rail-sub">Status if landing <span class="ldate-s">2028-03-01</span> 00:00 UTC</p>
      <ul class="sites">${railItems(o)}</ul>
      <button class="add"><svg class="i"><use href="#i-plus"/></svg>Add site</button>
    </div>
    <div class="mini">
      <button class="ib" data-act="lc" aria-label="Show the sites panel" title="Expand  [ "><svg class="i"><use href="#i-plo"/></svg></button>
      <span class="sep"></span>
      <div class="msites" style="display:flex;flex-direction:column;gap:4px">${railMini(o)}</div>
      <button class="madd" aria-label="Add site"><svg class="i" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>
      <span class="vtext">Selected sites · 5 of 8</span>
    </div>
  </aside>

  <main class="panel main">
    <div class="tabs" role="tablist" aria-label="Views">${tabs}</div>
    <div class="vbody">${V.body(o)}</div>
  </main>

  <aside class="panel focus" aria-label="Focused site">
    <div class="open">
      <div class="f-h"><h2>${f.name}</h2>
        <button class="ib" data-act="rc" aria-label="Collapse the focused-site panel" title="Collapse  ] "><svg class="i"><use href="#i-pr"/></svg></button>
        <p>${cr?'−89.4555°, 222.6192° E · core80 terrain · close-up DEM':'0.6742°, 23.4731° E · sphere tier · terrain not modelled'}</p></div>
      ${cr?focusCR():focusA11()}
      <nav class="links" aria-label="Open this site elsewhere"><a href="https://quickmap.lroc.asu.edu/">Open in Quickmap ↗</a><a href="https://trek.nasa.gov/moon/">Open in Moon Trek ↗</a></nav>
    </div>
    <div class="mini">
      <button class="ib" data-act="rc" aria-label="Show the focused-site panel" title="Expand  ] "><svg class="i"><use href="#i-pro"/></svg></button>
      <span class="sep"></span>
      ${lamp(f.st)}
      <span class="vtext"><b>${f.name}</b> · <span style="color:var(--status-${f.st==='nogo'?'nogo':'go'});font-weight:600">${WORD[f.st]}</span>${cr?' · <em>Longest blackout 31 h</em>, limit 12 h':' · score 100'}</span>
    </div>
  </aside>

  <section class="panel strip" aria-label="Timeline and countdowns">
    <div>
      <div class="tl-h"><h2>Timeline</h2>
        <span class="win">Mission window 01 Mar 00:00 → 11 Mar 00:00 UTC, 10 d <span class="tag src">sourced</span></span>
        <div class="ctl"><button class="play" aria-label="Play"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></button>
          <button class="btn speed">${V.speed||'1 h per second'}</button><button class="toggle"><i></i>Clearance chart</button>
          <button class="ib" data-act="tc" aria-label="Fold the timeline" title="Fold the timeline to its header"><svg class="i"><use href="#i-down"/></svg></button></div></div>
      <svg class="tl" width="996" height="140" role="img" aria-label="Sun and Earth bands for the mission window"></svg>
    </div>
    <div class="cards">${cr?`
      <div class="cd warn"><div class="hd"><svg class="i"><use href="#i-sun"/></svg>Sun<span class="state">Dark</span></div>
        <div class="ev">Sunrise in</div><div class="cnt">2<small>h</small>58<small>m</small></div>
        <div class="flag">${lamp('caution')}Under 6 h</div>
        <div class="vals"><span>Elevation<b>1.08°</b></span><span>Disc fraction<b>0.01</b></span></div></div>
      <div class="cd"><div class="hd"><svg class="i"><use href="#i-earth"/></svg>Earth<span class="state">Link</span></div>
        <div class="ev">Earthset in</div><div class="cnt">6<small>d</small>1<small>h</small></div>
        <div class="flag" style="visibility:hidden">&nbsp;</div>
        <div class="vals"><span>Elevation<b>2.97°</b></span><span>Clearance<b>2.46°</b></span></div></div>`:`
      <div class="cd"><div class="hd"><svg class="i"><use href="#i-sun"/></svg>Sun<span class="state">Lit</span></div>
        <div class="ev">Sunset in</div><div class="cnt">11<small>d</small>6<small>h</small></div>
        <div class="flag" style="visibility:hidden">&nbsp;</div>
        <div class="vals"><span>Elevation<b>31.4°</b></span><span>Disc fraction<b>1.00</b></span></div></div>
      <div class="cd"><div class="hd"><svg class="i"><use href="#i-earth"/></svg>Earth<span class="state">Link</span></div>
        <div class="ev">Earthset</div><div class="cnt" style="font-size:var(--t-lg);margin-top:4px">Never sets here</div>
        <div class="flag" style="visibility:hidden">&nbsp;</div>
        <div class="vals"><span>Elevation<b>66.2°</b></span><span>Clearance<b>66.2°</b></span></div></div>`}
    </div>
  </section>

  <footer class="foot"><span class="proto">prototype · mock data</span>Planning aid, not flight certification. Limits marked assumed are our estimates.
    <span class="more">${V.label}</span></footer>
</div>`;}

/* ── The same invented series for Connecting Ridge under im2_athena as every C2 page ── */
const M=(()=>{

/* ── Page boot: one frame per state; collapse buttons and [ ] keys work in every frame ── */
const FRAMES=[];
function boot(V,frames){
  document.body.insertAdjacentHTML('afterbegin',SPRITE);

  frames.forEach((o,i)=>{
    if(o.caption)root.insertAdjacentHTML('beforeend',`<div class="between"><h2>${o.caption.h}</h2><p>${o.caption.p}</p></div>`);
    const sec=document.createElement('section');sec.className='frame';sec.setAttribute('aria-label',o.caption?o.caption.h:'Default state');
    sec.innerHTML=shellHTML(o,V);root.appendChild(sec);
    const app=sec.querySelector('.app');
    const ctx={i,o,app,sec,V,state:{},plot:()=>app.querySelector('.plotbox'),
      redraw(){V.draw(ctx);}};
    FRAMES.push(ctx);
    drawTimeline(app.querySelector('.tl'),o.focus,o.hour);
    app.addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');
      if(b){const k=b.dataset.act;app.classList.toggle(k);o[k]=app.classList.contains(k);settle(ctx);return;}
      const s=e.target.closest('[data-slip]');

  });
  ACTIVE=FRAMES[0];
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea'))return;
    if(e.key==='['||e.key===']'){const k=e.key==='['?'lc':'rc';ACTIVE.app.classList.toggle(k);ACTIVE.o[k]=ACTIVE.app.classList.contains(k);settle(ACTIVE);}
  });
  if(document.fonts)document.fonts.ready.then(()=>FRAMES.forEach(f=>{if(typeof slipTimeline==='function'&&f.state.landing!=null&&f.state.landing!==LANDING)slipTimeline(f,f.state.landing);else drawTimeline(f.app.querySelector('.tl'),f.o.focus,f.o.hour);V.draw(f);}));
}
let ACTIVE=null;
function settle(ctx){

    if(S.create){const c=S.create;h.innerHTML=`<h3>New site here?</h3><p>${latlon(c.x,c.y)}</p><p>Sunlight ${pct(sampleGrid(P.SUN,c.x,c.y))} · Earth ${pct(sampleGrid(P.EAR,c.x,c.y))}</p>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="color:var(--ink);border-color:var(--ink-3)"><svg class="i" style="width:14px;height:14px"><use href="#i-plus"/></svg>Create a site here</button><button class="btn" data-x>Clear</button></div>`;
      h.querySelector('[data-x]').onclick=()=>{S.create=null;ctx.redraw();};}
    else h.innerHTML=`<h3>New site</h3><p>Click empty ground on the map to place one, or type coordinates.</p>`;},
  draw(ctx){const S=ctx.state,box=ctx.plot(),r=box.getBoundingClientRect();
    if(S.k==null){S.k=Math.min((r.width-290)/124,(r.height-50)/136);S.vx=12-60/S.k;}
    drawPolar(ctx,box,S);VIEW.panel(ctx);
    ctx.app.querySelector('.ovl').innerHTML=S.overlay==='none'?'':S.overlay==='sun'?'Overlay: share of time lit, 0 to 94 %, NASA average over 18.6 years':'Overlay: share of time Earth is above the horizon, 0 to 100 %';}
};
const FRAMES_DEF=[
  {focus:'cr',create:[48,22]},
  {focus:'cr',lc:true,rc:true,overlay:'earth',opacity:.6,artemis:true,view:[10,54,2.4],nudge:1.1,caption:{h:'Both side panels collapsed, Earth visibility on',
    p:'With the panels folded the map gains about 490 px of width while the column keeps its 252 px, so every selected site and most of the 80°S circle fit at once. The Earth-visibility overlay shows the near side (top) seeing Earth far more often than the far side. Connecting Ridge has been nudged about a kilometre and the column reads the change. Press <kbd>[</kbd> and <kbd>]</kbd> to fold or open the panels in any frame.'}},
];

boot(VIEW,FRAMES_DEF);
</script>
