<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academy lesson · Variant b</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Direction C2 tokens (see design/variants/direction-c2.md). Same block on every C2 page. ── */
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#141415; --raised:#1b1b1d; --hover:#232326;
  --line:#262629; --line-strong:#37373b;
  --ink:#ececee; --ink-2:#b3b3b8; --ink-3:#8c8c93; --ink-4:#5c5c63;
  --accent:#f3efe6; --accent-ink:#141414;
  --sun:#ffe2a0; --sun-core:#fff4d8; --earth:#6cc4ff; --earth-core:#9fdbff;
  --status-go:#45c98b; --status-caution:#f2a33a; --status-nogo:#f0646d;
  --plot:#0e0e0f; --terrain:#1d1d20; --terrain-rim:#a8a8af; --grid:rgba(255,255,255,.06);
  --font:"Jost","Futura","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --t-xs:11px; --t-sm:12px; --t-md:13px; --t-lg:15px; --t-xl:18px; --t-2xl:24px; --t-3xl:32px; --t-display:44px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  /* ── Academy additions, proposed in design/variants/c2-academy.md (not in DESIGN.md yet) ── */
  --t-ac:18px;          /* lesson body: the spec's 16 px floor plus room */
  --t-ac-min:16px;      /* the floor for lesson text on a phone */
  --t-ac-say:20px;      /* Luna's bubble */
  --t-ac-title:28px;    /* lesson and path titles */
  --r-xl:20px;          /* Academy cards and bubbles: rounder than Mission Control's 14 px */
  --s8:64px;
  --h-xl:56px;          /* big buttons: Check, Continue, Start */
  --h-opt:64px;         /* answer options */
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-lg);line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
text{font-family:var(--font)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-pill);border:3px solid var(--bg)}
html{scrollbar-color:var(--line-strong) transparent}

/* ── the review document around the frames ── */
.doc{width:1504px;margin:0 auto;padding:var(--s6) var(--s6) 120px}
.doc-h{display:flex;align-items:center;gap:var(--s4)}
.doc-h .brand{display:flex;align-items:center;gap:10px;font-size:var(--t-xl);font-weight:600}
.doc-h .brand svg{width:24px;height:24px}
.doc-h nav{margin-left:auto;display:flex;gap:var(--s5);font-size:var(--t-md);color:var(--ink-2)}
.doc-h nav a:hover{color:var(--ink)}
.doc-h nav a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.proto{font-size:var(--t-sm);color:var(--ink-3);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:0 8px;line-height:18px;white-space:nowrap}
.doc-title{margin-top:var(--s7)}
.doc-title h1{font-size:var(--t-3xl);font-weight:600;line-height:1.1}
.doc-title p{font-size:var(--t-xl);color:var(--ink-2);margin-top:var(--s3);max-width:80ch}
.toc{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5)}
.toc a{height:32px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:var(--t-md);color:var(--ink-2);display:inline-flex;align-items:center}
.toc a:hover{color:var(--ink);background:var(--hover)}
.state{margin-top:96px;scroll-margin-top:24px}
.state>h2{font-size:var(--t-2xl);font-weight:600;line-height:1.2}
.state>.cap{color:var(--ink-2);margin-top:var(--s2);max-width:96ch;font-size:var(--t-lg)}
.state>.cap b{color:var(--ink);font-weight:500}
.fl{font-size:var(--t-sm);color:var(--ink-3);margin:var(--s5) 0 var(--s2)}
.fr{position:relative;overflow:hidden;background:var(--bg);outline:1px solid var(--line-strong);container-type:inline-size}
.fr.d{width:1440px;height:900px;border-radius:var(--r-lg)}
.fr.p{width:390px;height:844px;border-radius:var(--r-xl)}
.fr.half{width:1440px;height:900px;border-radius:var(--r-lg);transform:scale(.5);transform-origin:0 0}
.halfbox{width:720px;height:450px;overflow:hidden;border-radius:var(--r-sm)}
.prow{display:flex;gap:var(--s6);align-items:flex-start}
.notes{max-width:64ch;color:var(--ink-2);font-size:var(--t-lg);padding-top:var(--s5)}
.notes h3{font-size:var(--t-xl);font-weight:600;color:var(--ink);margin-top:var(--s5)}
.notes h3:first-child{margin-top:0}
.notes p,.notes li{margin-top:var(--s2)}
.notes ul{padding-left:20px}
.play{margin-top:var(--s3);height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line-strong);font-size:var(--t-md);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.play:hover{background:var(--hover)}
.trio{display:grid;grid-template-columns:repeat(3,390px);gap:var(--s6)}
.trio-d{display:grid;grid-template-columns:repeat(2,720px);gap:var(--s5) var(--s5)}
.kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:var(--r-sm);font-size:var(--t-sm);color:var(--ink-2);line-height:1;vertical-align:1px;background:var(--surface)}

/* ── a screen inside a frame ── */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;font-size:var(--t-ac)}
.scr-body{flex:1;min-height:0;overflow:auto}

/* buttons */
.bx{height:var(--h-xl);padding:0 28px;border-radius:var(--r-pill);font-size:var(--t-xl);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;
  transition:background-color .15s ease-out,color .15s ease-out,transform .1s ease-out}
.bx svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bx.pri{background:var(--accent);color:var(--accent-ink)}
.bx.pri:hover{background:var(--sun-core)}
.bx.pri:active{transform:translateY(1px)}
.bx.sec{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.bx.sec:hover{background:var(--hover)}
.bx[disabled]{background:var(--raised);color:var(--ink-4);border:1px solid var(--line);cursor:default}
.bq{min-height:44px;padding:0 12px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:var(--t-lg)}
.bq:hover{background:var(--hover);color:var(--ink)}
.ib{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:20px;height:20px}

/* answer options */
.opt{width:100%;min-height:var(--h-opt);padding:12px 18px 12px 14px;border-radius:var(--r-lg);background:var(--raised);border:1px solid var(--line-strong);
  display:flex;align-items:center;gap:14px;font-size:var(--t-ac);color:var(--ink);transition:background-color .15s ease-out,box-shadow .15s ease-out}
.opt:hover{background:var(--hover)}
.opt .key{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:var(--t-md);color:var(--ink-3);flex:none}
.opt .lab{flex:1}
.opt .note{font-size:var(--t-lg);color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.opt.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--hover)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.missed{background:var(--surface);border-style:dashed;color:var(--ink-2);cursor:default}
.opt.missed .lab{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.opt.answer{box-shadow:inset 0 0 0 2px var(--accent);background:var(--hover)}
.opt.answer .note{color:var(--ink)}
.opt.dim{opacity:.55}
.opt.focus{outline:2px solid var(--accent);outline-offset:3px}

/* the achromatic "right" badge: a moonlight disc with a cut check. Statuses keep their colours for GO, CAUTION and NO-GO only */
.ok{width:26px;height:26px;border-radius:50%;background:var(--accent);display:inline-grid;place-items:center;flex:none}
.ok svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ok.lg{width:40px;height:40px}.ok.lg svg{width:22px;height:22px}
.retry{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-2);display:inline-grid;place-items:center;flex:none}
.retry svg{width:14px;height:14px;stroke:var(--ink-2);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.retry.lg{width:40px;height:40px}.retry.lg svg{width:20px;height:20px}

/* Luna's bubble */
.say{position:relative;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:16px 22px;font-size:var(--t-ac-say);line-height:1.4;color:var(--ink);max-width:560px}
.say.old{font-size:var(--t-ac);color:var(--ink-2);background:var(--surface);border-color:var(--line)}
.say .xp{display:inline-flex;margin-left:8px;font-size:var(--t-lg);color:var(--ink-2);font-weight:500}
.luna{display:block;flex:none}
.me{align-self:flex-end;background:transparent;border:1.5px solid var(--accent);border-radius:var(--r-xl);padding:12px 18px;font-size:var(--t-ac);color:var(--ink);max-width:420px}
.me.miss{border-style:dashed;border-color:var(--ink-3);color:var(--ink-2)}

/* Pip's meters and the lesson progress */
.meters{display:flex;align-items:center;gap:var(--s5)}
.m{display:flex;align-items:center;gap:8px;font-size:var(--t-lg);color:var(--ink-2);white-space:nowrap}
.m b{color:var(--ink);font-weight:500}
.m .bar{width:64px;height:6px;border-radius:var(--r-pill);background:var(--hover);overflow:hidden}
.m .bar i{display:block;height:100%;background:var(--sun);border-radius:var(--r-pill)}
.m.link b{color:var(--earth)}
.m.off b{color:var(--ink-2)}
.prog{display:flex;gap:6px;flex:1;max-width:420px}
.prog i{flex:1;height:8px;border-radius:var(--r-pill);background:var(--hover)}
.prog i.done{background:var(--accent)}
.prog i.now{background:var(--ink-3)}
.stepn{font-size:var(--t-lg);color:var(--ink-2);white-space:nowrap}

/* stars, XP and patches */
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:18px;height:18px}
.xpn{font-weight:500;color:var(--ink)}
.xpn small{font-size:.75em;color:var(--ink-2);font-weight:400;margin-left:2px}

/* the Under-the-hood card */
.uth{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:var(--s5) var(--s5) var(--s5)}
.uth h3{font-size:var(--t-xl);font-weight:600;margin-top:var(--s5)}
.uth h3:first-of-type{margin-top:var(--s4)}
.uth p{font-size:var(--t-lg);color:var(--ink-2);margin-top:6px;line-height:1.55;max-width:68ch}
.uth .head{display:flex;align-items:center;gap:12px}
.uth .head h2{font-size:var(--t-2xl);font-weight:600}
.uth .head .free{margin-left:auto;font-size:var(--t-md);color:var(--ink-3)}
.math{margin-top:10px;padding:16px 18px;border-radius:var(--r-md);background:var(--plot);border:1px solid var(--line);font-size:var(--t-2xl);color:var(--ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.math .frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle}
.math .frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 4px 2px}
.math .frac>span:last-child{padding:2px 4px 0}
.math .cite{margin-left:auto;font-size:var(--t-md);color:var(--ink-3)}
.math i{font-style:italic;font-family:var(--font)}
.we{margin-top:10px;width:100%;border-collapse:collapse;font-size:var(--t-lg)}
.we td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.we td:first-child{color:var(--ink-2);width:46%}
.we td:last-child{color:var(--ink)}
.fill{display:inline-block;padding:0 6px;border-radius:var(--r-sm);background:var(--raised);border:1px solid var(--line-strong);font-weight:500;color:var(--ink)}
.codelink{margin-top:8px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);font-size:var(--t-lg);color:var(--ink)}
.codelink:hover{background:var(--hover)}
.codelink code{font-family:var(--font);font-weight:500}
.uth ul{margin-top:6px;padding-left:20px;color:var(--ink-2);font-size:var(--t-lg)}
.uth li{margin-top:4px}

/* status lamp, used only for GO, CAUTION and NO-GO */
.lamp{--c:var(--status-go);width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;flex:none}
.lamp svg{width:12px;height:12px;stroke:#0b0b0c;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lamp.caution{--c:var(--status-caution)} .lamp.nogo{--c:var(--status-nogo)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.st.go{color:var(--status-go)} .st.caution{color:var(--status-caution)} .st.nogo{color:var(--status-nogo)}

/* panel box for embedded Mission Control panels: 360 px wide */
.mc-box{width:360px;max-width:100%;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-strong);overflow:hidden;flex:none}
.mc-box .mc-h{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--line);font-size:var(--t-md);color:var(--ink-2)}
.mc-box .mc-h b{color:var(--ink);font-weight:500}
.mc-box .mc-h .r{margin-left:auto;color:var(--ink-3);font-size:var(--t-sm)}
.mc-box svg.plot{display:block;width:100%;height:auto}
.mc-box .mc-f{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 12px;border-top:1px solid var(--line);font-size:var(--t-ac-min);color:var(--ink-2)}
.mc-box .mc-f b{color:var(--ink);font-weight:500}
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--t-lg);color:var(--ink-3);margin-top:10px}
@container (max-width:600px){.bx{white-space:normal;text-align:center;height:auto;min-height:var(--h-xl);padding:10px 22px;line-height:1.25}}

/* range slider, themed */
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer}
input[type=range].rng::-webkit-slider-runnable-track{height:6px;border-radius:var(--r-pill);background:var(--hover)}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);margin-top:-11px;border:0}
input[type=range].rng::-moz-range-track{height:6px;border-radius:var(--r-pill);background:var(--hover)}
input[type=range].rng::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:0}

/* the moondust burst on a correct answer (see the caption for the motion) */
.dust{position:absolute;pointer-events:none;overflow:visible}
.dust i{position:absolute;left:0;top:0;border-radius:50%;background:var(--accent)}
@keyframes hop{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.dust.playing i{animation:none!important;opacity:0!important}}

/* finale map legend */
.flegend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:var(--t-md);color:var(--ink-2)}
.flegend span{display:inline-flex;align-items:center;gap:8px}
.flegend i{display:inline-block;flex:none}
.lg-pip{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.lg-reg{width:14px;height:14px;border:1.4px dashed var(--ink-2);background:rgba(179,179,184,.08)}
.lg-sun{width:14px;height:14px;border-radius:50%;background:rgba(179,179,184,.22)}


/* ── Variant b: a split stage. What you touch is on the stage; what you say is in the conversation ── */
.lt{display:flex;align-items:center;gap:24px;height:64px;padding:0 16px;flex:none}
.lt-a{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.lt-b{display:flex;align-items:center;gap:16px}
.ltitle{font-size:var(--t-lg);color:var(--ink-2);white-space:nowrap}
.lt .prog{max-width:320px}
.pipm{display:flex;align-items:center;gap:14px}
.pipicon{font-size:var(--t-lg);color:var(--ink-3)}
.skip{font-size:var(--t-lg);color:var(--ink-2);min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--r-md);white-space:nowrap}
.skip:hover{background:var(--hover);color:var(--ink)}
.skip svg{width:16px;height:16px}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 520px;gap:8px;padding:0 8px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-height:0;position:relative}
.stg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;overflow:hidden}
.stg .scene{width:100%;max-width:820px;height:auto}
.stg.scn{padding:0;justify-content:flex-end}
.stg.scn .scene{max-width:none;display:block}
.stg .dust{left:var(--dx0,50%);top:var(--dy0,60%)}
.stg-row{display:flex;align-items:center;gap:40px}
.big-read{display:flex;flex-direction:column;gap:14px;min-width:220px}
.big-read .k{font-size:var(--t-lg);color:var(--ink-2)}
.big-read .v{font-size:var(--t-3xl);font-weight:500;line-height:1.1;color:var(--ink)}
.big-read .v small{font-size:var(--t-md);color:var(--ink-2);font-weight:400}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--t-lg);color:var(--ink-3)}
.mc-box.wide{width:620px}
.stg .tag-step{position:absolute;left:20px;top:16px;font-size:var(--t-md);color:var(--ink-3)}

/* the conversation panel */
.tp{display:flex;flex-direction:column}
.tabs{display:flex;padding:3px;margin:16px 16px 0;border-radius:var(--r-pill);background:var(--raised);border:1px solid var(--line);flex:none}
.tabs button{flex:1;height:44px;border-radius:var(--r-pill);font-size:var(--t-lg);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--hover);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line-strong)}
.log{flex:1;min-height:0;overflow:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end}
.msg .say{font-size:var(--t-ac);padding:12px 16px;border-bottom-left-radius:6px}
.msg.last .say{font-size:var(--t-ac-say)}
.msg.old .say{color:var(--ink-2);background:var(--surface);border-color:var(--line)}
.msg .luna{align-self:flex-end}
.me{align-self:flex-end;border-bottom-right-radius:6px}
.ans{padding:4px 20px 0;display:flex;flex-direction:column;gap:10px;flex:none}
.ans .opt{min-height:56px}
.act{padding:16px 20px 20px;display:flex;align-items:center;gap:12px;flex:none}
.act .res{display:flex;align-items:center;gap:10px;font-size:var(--t-xl);font-weight:600;flex:1}
.act .res .xpc{font-size:var(--t-lg);font-weight:500;color:var(--ink-2)}
.act .bx{min-width:180px;margin-left:auto}
.act .keys{flex:1}
.uthp{flex:1;min-height:0;overflow:auto;padding:16px}
.uthp .uth{border:0;padding:4px 4px 16px;background:transparent}

/* scenes: formula, lines */
.formula{background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:32px 36px;font-size:var(--t-display);display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.formula i{font-style:normal;color:var(--ink-2)}
.slot{min-width:112px;height:76px;border-radius:var(--r-lg);border:2px dashed var(--ink-3);display:inline-grid;place-items:center;padding:0 16px}
.slot.full{border:0;box-shadow:inset 0 0 0 2px var(--accent);background:var(--hover);font-weight:500}
.tiles{display:flex;gap:14px}
.tile{min-width:112px;height:72px;border-radius:var(--r-lg);background:var(--raised);border:1px solid var(--line-strong);font-size:var(--t-3xl);display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.tile .key{width:24px;height:24px;border-radius:var(--r-sm);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:var(--t-sm);color:var(--ink-3)}
.tile.used{background:transparent;border-style:dashed;color:var(--ink-4)}
.calc{width:640px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.calc h3{font-size:var(--t-xl);font-weight:600;color:var(--ink-2);font-weight:500}
.sl{width:360px;max-width:100%}
.sl-r{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-lg);color:var(--ink-2)}
.sl-r b{color:var(--ink);font-weight:500;font-size:var(--t-xl)}
.goal{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-lg);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-ac-min);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:var(--r-sm);display:inline-block}

@container (max-width:600px){
  .lt{flex-direction:column;align-items:stretch;height:auto;padding:6px 8px 4px;gap:0}
  .lt-a{gap:8px}
  .ltitle{display:none}
  .lt-b{justify-content:space-between;gap:8px;padding-left:8px}
  .pipm .pipicon{display:none}
  .m .bar{width:40px}
  .pipm{gap:12px}
  .skip{padding:0 6px}
  .split{display:flex;flex-direction:column;padding:0;gap:0}
  .stg{flex:none;height:300px;border-radius:0;border-width:1px 0;padding:12px 16px;gap:10px}
  .stg.tall{height:360px}
  .stg-row{flex-direction:column;gap:8px}
  .big-read{flex-direction:row;flex-wrap:wrap;gap:4px 14px;min-width:0}
  .big-read .v{font-size:var(--t-xl)}
  .big-read .k{font-size:var(--t-md)}
  .stg .keys,.stg .tag-step{display:none}
  .mc-box.wide{width:100%}
  .tp{flex:1;border-radius:var(--r-xl) var(--r-xl) 0 0;border-width:1px 0 0;margin-top:-12px;background:var(--surface)}
  .tabs{margin:12px 16px 0}
  .log{padding:12px 16px 4px;gap:10px}
  .msg .luna{width:48px;height:48px}
  .msg.old .luna{visibility:hidden;width:0;margin-right:-10px}
  .msg .say,.msg.last .say{font-size:var(--t-ac)}
  .ans{padding:4px 16px 0;gap:8px}
  .act{padding:12px 16px 16px;flex-wrap:wrap}
  .act .keys{display:none}
  .act .res{flex-basis:100%;font-size:var(--t-ac)}
  .act .bx{flex:1;min-width:0}
  .formula{font-size:var(--t-2xl);padding:16px;gap:8px}
  .slot{min-width:72px;height:52px}
  .tile{min-width:0;flex:1;font-size:var(--t-2xl);height:52px}
  .tiles{width:100%}
  .calc{gap:6px}
  .calc .opt{min-height:44px;font-size:var(--t-ac-min);padding:6px 10px}
  .calc .opt .note{display:none}
  .stg.scn{height:240px}
  .stg .dust{top:58%}
  .stg.scn .scene{width:auto;height:240px}
  .ans .opt.missed{display:none}
  .ans .opt{min-height:52px}
  .calc h3{display:none}
  .sl{width:100%}
  .uthp{padding:8px 12px}
}
</style>
</head>
<body>
<main id="doc" class="doc"></main>
<script>
/* ── shared prototype kit: icons, Luna, Pip, patches, small panels. Colours come from the CSS tokens. ── */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),ink4:css('--ink-4'),line:css('--line'),lineS:css('--line-strong'),
  bg:css('--bg'),surface:css('--surface'),raised:css('--raised'),hover:css('--hover'),accent:css('--accent'),accentInk:css('--accent-ink'),
  sun:css('--sun'),sunCore:css('--sun-core'),earth:css('--earth'),earthCore:css('--earth-core'),plot:css('--plot'),terrain:css('--terrain'),rim:css('--terrain-rim'),grid:css('--grid'),
  go:css('--status-go'),caution:css('--status-caution'),nogo:css('--status-nogo')};
let UID=0; const uid=p=>(p||'u')+(++UID);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* icons: one stroke family, 1.8 px on a 24 grid */
const I={
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  next:'<path d="M5 12h13M13 6l6 6-6 6"/>',
  ext:'<path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  ant:'<path d="M12 10.5V21M8.5 21h7"/><circle cx="12" cy="9" r="1.6"/><path d="M8.6 5.6a4.8 4.8 0 0 0 0 6.8M15.4 5.6a4.8 4.8 0 0 1 0 6.8M5.8 2.8a8.8 8.8 0 0 0 0 12.4M18.2 2.8a8.8 8.8 0 0 1 0 12.4"/>',
  antOff:'<path d="M12 10.5V21M8.5 21h7"/><circle cx="12" cy="9" r="1.6"/><path d="M8.6 5.6a4.8 4.8 0 0 0 0 6.8M15.4 5.6a4.8 4.8 0 0 1 0 6.8"/><path d="M4 3l16 18"/>',
  hood:'<path d="M5 19V9l7-5 7 5v10"/><path d="M9 19v-5h6v5"/><path d="M3 19h18"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevU:'<path d="M6 15l6-6 6 6"/>',
  check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  retry:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>',
  sound:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/>',
  menu:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  key:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
  hand:'<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 10V4.5a1.5 1.5 0 0 1 3 0V11M15 10.5V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 5 16.5l-1.6-3.3a1.4 1.4 0 0 1 2.4-1.4L9 15"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>',
  badge:'<circle cx="12" cy="12" r="9"/><path d="M12 7.2l1.45 3 3.25.4-2.4 2.2.62 3.2L12 14.4 9.08 16l.62-3.2-2.4-2.2 3.25-.4z"/>',
  map:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 3v18M3 12h18"/>'
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const okBadge=(lg)=>`<span class="ok${lg?' lg':''}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>`;
const seeBadge=(lg)=>`<span class="retry${lg?' lg':''}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>`;
const retryBadge=(lg)=>`<span class="retry${lg?' lg':''}" aria-hidden="true"><svg viewBox="0 0 24 24">${I.retry}</svg></span>`;
const lamp=(k)=>{const g={go:'<path d="M5 12.5l4.2 4.2L19 7"/>',caution:'<path d="M12 6v7M12 17.5v.5"/>',nogo:'<path d="M7 7l10 10M17 7L7 17"/>'}[k];
  return `<span class="lamp ${k}" aria-hidden="true"><svg viewBox="0 0 24 24">${g}</svg></span>`;};
const status=(k)=>`<span class="st ${k}">${lamp(k)}${{go:'GO',caution:'CAUTION',nogo:'NO-GO'}[k]}</span>`;

/* stars: filled moonlight for earned, an outline for not yet */
function stars(n,size=18,label=true){
  const p='M12 2.8l2.75 5.75 6.3.8-4.6 4.35 1.15 6.25L12 16.9l-5.6 3.05 1.15-6.25L2.95 9.35l6.3-.8z';
  let s='';for(let i=0;i<3;i++)s+=`<svg viewBox="0 0 24 24" style="width:${size}px;height:${size}px" aria-hidden="true"><path d="${p}" fill="${i<n?C.ink:'none'}" stroke="${i<n?C.ink:C.lineS}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  return `<span class="stars" ${label?`role="img" aria-label="${n} of 3 stars"`:'aria-hidden="true"'}>${s}</span>`;
}

/* ── Luna: the placeholder moon face from web/src/components/luna/art (viewBox 0 0 100 100).
   Body in Ink 2, craters in Ink 3, features cut in Night. Extras recoloured to the C2 rules: sparkles and the
   proud star in Sun cream (the component uses the CAUTION amber), the worried drop in Ink 2. ── */
const LUNA={
  idle:{eyes:'r',mouth:'<path d="M43 64 Q50 68 57 64"/>',label:'Luna, calm and waiting'},
  happy:{eyes:'r',mouth:'<path d="M37 61 Q50 75 63 61"/>',label:'Luna, smiling'},
  thinking:{eyes:'r5,2,-3',brows:'<path d="M56 35 Q62 31 68 34"/>',mouth:'<path d="M44 66 L57 63"/>',extras:`<g fill="${C.ink}"><circle cx="76" cy="18" r="2.5"/><circle cx="84" cy="11" r="3.5"/></g>`,label:'Luna, thinking it over'},
  cheering:{eyesPath:'<path d="M32 50 Q38 42 44 50 M56 50 Q62 42 68 50"/>',mouthFill:'<path d="M35 59 Q50 82 65 59 Z"/>',extras:`<g fill="${C.sun}"><path d="M14 18 L16 24 L22 26 L16 28 L14 34 L12 28 L6 26 L12 24 Z"/><path d="M86 14 L87.5 18.5 L92 20 L87.5 21.5 L86 26 L84.5 21.5 L80 20 L84.5 18.5 Z"/></g>`,label:'Luna, cheering'},
  worried:{eyes:'r5,0,1',brows:'<path d="M31 38 L43 34 M57 34 L69 38"/>',mouth:'<path d="M40 69 Q45 63 50 67 Q55 71 60 65"/>',extras:`<path fill="${C.ink2}" d="M80 30 Q85 38 85 41 A5 5 0 0 1 75 41 Q75 38 80 30 Z"/>`,label:'Luna, worried'},
  surprised:{eyes:'r7,0,-1',brows:'<path d="M31 34 Q38 28 45 33 M55 33 Q62 28 69 34"/>',mouthFill:'<ellipse cx="50" cy="67" rx="5.5" ry="6.5"/>',label:'Luna, surprised'},
  sleepy:{eyesPath:'<path d="M32 49 Q38 55 44 49 M56 49 Q62 55 68 49"/>',mouth:'<path d="M46 65 Q50 67 54 65"/>',extras:`<path fill="none" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M74 14 H83 L74 23 H83 M86 4 H91 L86 9 H91"/>`,label:'Luna, sleepy'},
  proud:{eyesPath:'<path d="M32 48 Q38 42 44 48 M56 48 Q62 42 68 48"/>',mouth:'<path d="M38 61 Q52 72 64 58"/>',extras:`<g><circle cx="78" cy="80" r="10" fill="${C.raised}" stroke="${C.ink}" stroke-width="2"/><path fill="${C.sun}" d="M78 73 L80 78 L85 78.5 L81 81.5 L82.5 86.5 L78 83.5 L73.5 86.5 L75 81.5 L71 78.5 L76 78 Z"/></g>`,label:'Luna, proud'}
};
function luna(mood='happy',size=96,decorative=false){
  const m=LUNA[mood],F=C.bg,L=`fill="none" stroke="${F}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"`;
  let eyes='';
  if(m.eyes){const [r,dx,dy]=(m.eyes==='r'?'5.5,0,0':m.eyes.slice(1)).split(',').map(Number);
    eyes=`<circle fill="${F}" cx="${38+dx}" cy="${48+dy}" r="${r}"/><circle fill="${F}" cx="${62+dx}" cy="${48+dy}" r="${r}"/>`;}
  else eyes=`<g ${L}>${m.eyesPath}</g>`;
  const brows=m.brows?`<g ${L.replace('stroke-width="4"','stroke-width="3.2"')}>${m.brows}</g>`:'';
  const mouth=m.mouthFill?`<g fill="${F}">${m.mouthFill}</g>`:`<g ${L}>${m.mouth}</g>`;
  const a=decorative?'aria-hidden="true"':`role="img" aria-label="${m.label}"`;
  return `<svg class="luna" data-mood="${mood}" width="${size}" height="${size}" viewBox="0 0 100 100" ${a}>
    <circle cx="50" cy="52" r="40" fill="${C.ink2}" stroke="${C.ink3}" stroke-width="2"/>
    <g fill="${C.ink3}" opacity=".55"><circle cx="27" cy="32" r="6"/><circle cx="73" cy="73" r="5"/><circle cx="23" cy="64" r="3.5"/><circle cx="71" cy="28" r="3"/><circle cx="50" cy="86" r="2.5"/></g>
    ${eyes}${brows}${mouth}${m.extras||''}</svg>`;
}

/* ── Pip: the small lander from the start screen, lit from the right ── */
function pipG(x,y,s=1,label=false){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-14 22 L-8 8 M14 22 L8 8 M0 22 L0 10" stroke="${C.ink2}" stroke-width="2" stroke-linecap="round"/>
    <rect x="-11" y="-4" width="22" height="14" rx="3" fill="${C.accent}"/>
    <rect x="1" y="-4" width="10" height="14" rx="2" fill="${C.sun}" fill-opacity=".55"/>
    <rect x="-26" y="-1" width="13" height="7" rx="1.5" fill="${C.ink4}"/><rect x="13" y="-1" width="13" height="7" rx="1.5" fill="${C.ink4}"/>
    <path d="M0 -4 L0 -12" stroke="${C.accent}" stroke-width="1.6"/><circle cx="0" cy="-13" r="2.4" fill="${C.earth}"/>
    ${label?`<text x="0" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="${C.ink}">Pip</text>`:''}</g>`;
}
const pip=(size=48)=>`<svg width="${size}" height="${size*.75}" viewBox="-30 -18 60 45" aria-hidden="true">${pipG(0,0,1)}</svg>`;

/* ── the eight lessons, from docs/academy/lessons.md ── */
const LESSONS=[
  {n:1,t:"Where's the Sun?",tag:'The Sun never climbs here; it circles the horizon.',patch:'Sun Chaser',unl:'System view'},
  {n:2,t:'Mountains steal sunlight',tag:'With the Sun this low, the skyline decides light or shadow.',patch:'Skyline Sketcher',unl:"Lander's eye"},
  {n:3,t:'The Moon is round',tag:'The ground curves away, so far mountains sink.',patch:'Horizon Hunter',unl:'Local terrain'},
  {n:4,t:'Phone home',tag:'Earth bobs above and below the horizon each month.',patch:'Signal Keeper',unl:'Timeline and countdowns'},
  {n:5,t:"Don't tip over",tag:'Slope decides whether a lander stays upright.',patch:'Steady Feet',unl:'Slope overlay'},
  {n:6,t:'Trade-offs',tag:'Hard limits rule sites out; preferences rank the rest.',patch:'Decision Maker',unl:'Compare'},
  {n:7,t:'The slip',tag:'The date matters as much as the place.',patch:'Time Bender',unl:'Slip Planner'},
  {n:8,t:'Final mission',tag:'Choose where and when Pip lands.',patch:'Mission Planner',unl:'Mission Control'}
];
/* mock progress: lessons 1 to 3 done, Luna waits at lesson 4 */
const PROGRESS={done:{1:{stars:2,xp:42},2:{stars:3,xp:50},3:{stars:2,xp:45}},next:4};
const TOTAL_XP=137;

/* ── mission patches: a round porthole badge with a line glyph. Earned: solid ring; not yet: dashed ── */
const PATCH_GLYPH=[
  (k,h)=>`<path d="M14 40 H50" stroke="${k}"/><ellipse cx="32" cy="40" rx="15" ry="5" stroke="${k}" stroke-dasharray="1.5 3.5"/><circle cx="41" cy="36.5" r="5" fill="${h(C.sun)}" stroke="none"/>`,
  (k,h)=>`<circle cx="38" cy="30" r="5.5" fill="${h(C.sun)}" stroke="none"/><path d="M13 44 L22 34 L28 38 L35 27 L43 37 L51 33 V46 H13Z" fill="${C.surface}" stroke="${k}"/>`,
  (k,h)=>`<path d="M12 46 Q32 28 52 46" stroke="${k}"/><path d="M27 33.5 L31 27 L35 33" stroke="${k}"/><path d="M12 30 H52" stroke="${k}" stroke-dasharray="2 3"/>`,
  (k,h)=>`<path d="M14 42 H50" stroke="${k}"/><path d="M24 42 A8 8 0 0 1 40 42" fill="${h(C.earth)}" stroke="none"/><path d="M22 30 A13 13 0 0 1 42 30 M26 25 A19 19 0 0 1 38 25" stroke="${k}"/>`,
  (k,h)=>`<path d="M14 44 H50" stroke="${k}"/><rect x="25" y="25" width="14" height="10" rx="2" stroke="${k}"/><path d="M27 35 L22 44 M37 35 L42 44 M32 35 V44" stroke="${k}"/>`,
  (k,h)=>`<path d="M32 20 V44 M24 44 H40 M18 28 H46" stroke="${k}"/><path d="M14 38 L18 28 L22 38 Z M42 38 L46 28 L50 38 Z" stroke="${k}"/>`,
  (k,h)=>`<rect x="19" y="21" width="26" height="24" rx="3" stroke="${k}"/><path d="M19 28 H45 M25 18 V24 M39 18 V24" stroke="${k}"/><path d="M26 38 a6 6 0 1 0 6-6" stroke="${k}"/><path d="M32 29.5 V34.5 H29" stroke="none"/>`,
  (k,h)=>`<circle cx="32" cy="33" r="13" stroke="${k}"/><circle cx="32" cy="33" r="6" stroke="${k}" stroke-dasharray="1.5 2.5"/><path d="M38 21 a5 5 0 0 1 5 5 c0 4 -5 8 -5 8 s-5-4-5-8 a5 5 0 0 1 5-5z" fill="${h(C.accent)}" stroke="${k}"/>`,
  (k,h)=>`<circle cx="32" cy="32" r="14" stroke="${k}"/><path d="M32 18 L36 32 L32 46 L28 32Z" fill="${h(C.ink)}" stroke="none"/><path d="M32 32 L36 32 L32 46Z" fill="${h(C.ink3)}" stroke="none"/>`
];
const PATCH_NAMES=[...LESSONS.map(l=>l.patch),'True South'];
function patch(i,earned,size=64,decorative=true){
  const k=earned?C.ink:C.lineS,h=c=>earned?c:'none';
  const ring=earned?`<circle cx="32" cy="32" r="30" fill="${C.raised}" stroke="${C.ink2}" stroke-width="1.5"/><circle cx="32" cy="32" r="26" fill="none" stroke="${C.lineS}"/>`
    :`<circle cx="32" cy="32" r="30" fill="none" stroke="${C.lineS}" stroke-width="1.5" stroke-dasharray="3 4"/>`;
  const a=decorative?'aria-hidden="true"':`role="img" aria-label="${PATCH_NAMES[i]} patch, ${earned?'earned':'not earned yet'}"`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" ${a}>${ring}<g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${PATCH_GLYPH[i](k,h)}</g></svg>`;
}

/* ── moondust: a correct answer kicks up regolith that rises and settles in the Moon's slow gravity.
   still(): a frozen mid-flight frame. play(): the 1.1 s motion. Reduced motion: no particles at all. ── */
function rnd(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,((s^s>>>14)>>>0)/4294967296));}
function dustParticles(n,seed){const r=rnd(seed),P=[];
  for(let i=0;i<n;i++){const ang=(-90+(r()-.5)*150)*Math.PI/180,v=90+r()*150;P.push({vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,s:2+r()*4.5,c:r()<.7?C.accent:(r()<.6?C.ink2:C.sunCore)});}
  return P;}
function dustHTML(n=26,seed=7,t=.42){const g=150;
  return dustParticles(n,seed).map(p=>{const x=p.vx*t,y=p.vy*t+.5*g*t*t;
    return `<i style="width:${p.s}px;height:${p.s}px;background:${p.c};transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px);opacity:${(1-t*.6).toFixed(2)}"></i>`;}).join('');}
function playDust(el,seed=7){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.innerHTML='';return;}
  const P=dustParticles(26,seed),g=150;el.innerHTML='';
  P.forEach(p=>{const i=document.createElement('i');i.style.cssText=`width:${p.s}px;height:${p.s}px;background:${p.c}`;el.appendChild(i);
    const kf=[];for(let k=0;k<=10;k++){const t=k/10*1.1;kf.push({transform:`translate(${(p.vx*t).toFixed(1)}px,${(p.vy*t+.5*g*t*t).toFixed(1)}px)`,opacity:k<7?1:1-(k-7)/3});}
    i.animate(kf,{duration:1100,easing:'linear',fill:'forwards'});});
  setTimeout(()=>{el.innerHTML=dustHTML(26,seed);},1300);
}

/* ── small Mission Control panels, drawn simply, 360 px wide ── */
const elC=(n)=>`<text font-size="11" fill="${C.ink3}"`;
/* Lander's eye for lesson 1 step 2: flat skyline, the Sun's month-long path, the Sun mid-drag */
function landersEyeDrag(az=100,best=null,focus=true){
  const id=uid('le'),Y=e=>150-e*40,X=a=>a;
  const sunEl=a=>1.36+.64*Math.cos((a-60)*Math.PI/180);
  let path='';for(let a=0;a<=360;a+=3)path+=(a?'L':'M')+X(a)+','+Y(sunEl(a)).toFixed(1);

  if(o.hood) return `<aside class="panel tp" aria-label="Under the hood">${tabs}<div class="uthp">${uthCard()}</div><div class="act"><button class="bx sec" style="margin-left:0;flex:1">Back to Luna</button></div></aside>`;
  const act=o.res?`<div class="res">${o.res.badge}<span>${o.res.h}</span>${o.res.xp?`<span class="xpc" data-pop>${o.res.xp}</span>`:''}</div><button class="bx pri">${o.btn||'Continue'}</button>`
    :`${o.keys?`<span class="keys">${o.keys}</span>`:''}<button class="bx pri"${o.disabled?' disabled':''}>${o.btn||'Check'}</button>`;
  return `<aside class="panel tp" aria-label="Conversation with Luna">${tabs}<div class="log" aria-live="polite">${o.log}</div>${o.ans?`<div class="ans" role="radiogroup" aria-label="Answers">${o.ans}</div>`:''}<div class="act">${act}</div></aside>`;
}
const screen=(t,stage,talk,cls='')=>{if(/class="scene"/.test(stage)&&!cls)cls='scn';return `<div class="scr">${lTop(t)}<div class="split"><section class="panel stg ${cls}" aria-label="Stage">${stage}</section>${talkPanel(talk)}</div></div>`;};

const Q1='At my equator the midday Sun is almost overhead. How high does it get at my south pole?';

/* the stage's sky ruler: Pip on the ground, a quarter circle from the horizon to straight up */
function skyRuler(o={}){
  const cx=150,cy=420,R=360,P=(a,r=R)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
  let s=`<svg class="scene" viewBox="0 0 820 500" preserveAspectRatio="xMinYMax meet" role="img" aria-label="Pip on the ground under a sky ruler from the horizon to straight up${o.sun?'. The Sun sits just above the horizon at its highest, 2 degrees.':''}">`;
  let arc='';for(let a=0;a<=90;a+=1){const [x,y]=P(a);arc+=(a?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}
  s+=`<path d="${arc}" fill="none" stroke="${C.lineS}" stroke-width="2"/>`;
  for(let a=0;a<=90;a+=15){const [x1,y1]=P(a,R-10),[x2,y2]=P(a,R+10);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.ink3}" stroke-width="1.5"/>`;const [tx,ty]=P(a,R+34);s+=`<text x="${tx}" y="${ty+5}" text-anchor="middle" font-size="17" fill="${C.ink3}">${a}°</text>`;}
  const mark=(a,label,kind)=>{const [x,y]=P(a,R),st=kind==='sel'?C.accent:kind==='ans'?C.accent:C.ink3;
    let m=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${st}" stroke-width="${kind==='miss'?1.5:2}" ${kind==='miss'?'stroke-dasharray="5 6"':''}/>`;
    const [lx,ly]=P(a,R-60);m+=`<rect x="${lx-80}" y="${ly-17}" width="160" height="32" rx="16" fill="${C.plot}" stroke="${st}" ${kind==='miss'?'stroke-dasharray="4 4"':''}/><text x="${lx}" y="${ly+6}" text-anchor="middle" font-size="17" fill="${kind==='miss'?C.ink2:C.ink}">${label}</text>`;return m;};
  (o.miss||[]).forEach(([a,l])=>s+=mark(a,l,'miss'));
  if(o.sel)s+=mark(o.sel[0],o.sel[1],'sel');
  const gd='M-400 430 L0 432 L60 428 L120 424 L190 426 L260 420 L330 424 L420 418 L520 426 L600 421 L700 428 L820 424 L1400 426';
  if(o.sun){const [x,y]=P(2,R);s+=`<circle cx="${x}" cy="${y-2}" r="14" fill="${C.sunCore}"/><path d="M${cx+30},${cy-6} Q${cx+200},${cy-14} ${x-18},${y-3}" fill="none" stroke="${C.sun}" stroke-width="1.6" stroke-dasharray="2 5"/>
    <rect x="${x-150}" y="${y-62}" width="170" height="32" rx="16" fill="${C.plot}" stroke="${C.sun}"/><text x="${x-65}" y="${y-40}" text-anchor="middle" font-size="17" fill="${C.sun}">Highest: 2.0°</text>`;}
  s+=`<path d="${gd} L1400 520 L-400 520Z" fill="${C.terrain}"/><path d="${gd}" fill="none" stroke="${C.rim}" stroke-width="1.3"/>`;
  s+=pipG(cx,cy-12,1.5);
  s+=`<text x="${cx}" y="482" text-anchor="middle" font-size="17" fill="${C.ink2}">Pip, at my south pole</text></svg>`;
  return s;
}
/* lesson 1 step 5: at the pole, every way you face is north */
function poleScene(){
  let s=`<svg class="scene" viewBox="0 0 820 500" role="img" aria-label="Pip standing exactly on the south pole. Arrows point out in every direction, and each one is labelled north.">
    <ellipse cx="410" cy="330" rx="330" ry="110" fill="${C.terrain}" stroke="${C.rim}" stroke-opacity=".5"/>`;
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2+Math.PI/8,x=410+250*Math.cos(a),y=330+82*Math.sin(a),x0=410+60*Math.cos(a),y0=330+20*Math.sin(a);
    const ah=Math.atan2(y-y0,x-x0),h1=[x-12*Math.cos(ah-0.45),y-12*Math.sin(ah-0.45)],h2=[x-12*Math.cos(ah+0.45),y-12*Math.sin(ah+0.45)];
    s+=`<path d="M${x0},${y0} L${x},${y} M${h1} L${x},${y} L${h2}" fill="none" stroke="${C.accent}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    const tx=410+290*Math.cos(a),ty=330+100*Math.sin(a)+5;s+=`<text x="${tx}" y="${ty}" text-anchor="middle" font-size="18" fill="${C.ink}">north</text>`;}
  s+=`<g data-hop style="transform-box:fill-box">${pipG(410,300,1.5)}</g><text x="410" y="470" text-anchor="middle" font-size="17" fill="${C.ink2}">Pip, exactly on the pole</text></svg>`;
  return s;
}
function uthCard(){
  return `<section class="uth" aria-label="Under the hood"><div class="head"><h2>The Moon is round</h2><span class="free">Never costs XP</span></div>
  <h3>The idea</h3><p>My surface is round, so the ground falls away below a level line as you look farther out. A far ridge must be taller just to reach Pip's horizon, and with the Sun only 1–2° up, that drop decides light or shadow.</p>
  <h3>The formula</h3>
  <div class="math"><i>e</i> ≈ arctan <span class="frac"><span>(<i>z</i> − <i>z</i><sub>0</sub> − <i>h</i>) − <i>s</i>² ⁄ 2<i>R</i></span><span><i>s</i></span></span><span class="cite">science.md §4</span></div>
  <p><i>s</i> is the distance along the ground, <i>R</i> is my radius, and <i>s</i>² ⁄ 2<i>R</i> is how far the ground has dropped.</p>
  <h3>Worked example: the stage's ridge</h3>
  <table class="we"><tbody>
    <tr><td>Distance, <i>s</i></td><td><span class="fill">60 km</span></td></tr>
    <tr><td>My radius, <i>R</i></td><td><span class="fill">1,737.4 km</span></td></tr>
    <tr><td>Drop</td><td><span class="fill">60</span>² ÷ (2 × <span class="fill">1,737.4</span>) = <span class="fill">1,036 m</span></td></tr>
    <tr><td>Ridge above Pip</td><td><span class="fill">1,000 m</span></td></tr>
    <tr><td>Above the curved horizon</td><td><span class="fill">−36 m</span></td></tr>
    <tr><td>Looks, <i>e</i></td><td>arctan(<span class="fill">−36</span> ÷ <span class="fill">60,000</span>) = <span class="fill">−0.03°</span></td></tr>
    <tr><td>The Sun</td><td><span class="fill">0.8°</span> up: Pip is lit</td></tr>
  </tbody></table>
  <p>Boxed numbers are filled in from the real data when the lesson is built.</p>
  <h3>In the code</h3><a class="codelink" href="#">${ic('ext')}<code>skyline.py</code> · elevation_angle</a>
  <h3>What can go wrong</h3><ul><li>A flat-Moon calculation, like the one on the stage, puts far ridges in the sky.</li><li>The short formula drifts at long range, so the code uses the exact one in §4.</li></ul></section>`;
}
