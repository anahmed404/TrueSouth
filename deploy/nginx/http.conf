server_tokens off;
server {
    listen 127.0.0.1:80;
    server_name 127.0.0.1;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 444; }
}
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name ${TRUESOUTH_DOMAIN};
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://${TRUESOUTH_DOMAIN}$request_uri; }
}
