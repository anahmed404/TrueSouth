# Catalog-only. Project name and image stay on the truesouth-* prefix so this
# checkout does not take over another compose project on the same machine.
name: truesouth-s13

services:
  truesouth:
    build: .
    image: truesouth-s13:catalog
    ports:
      - "8080:8080"
    restart: unless-stopped

# No init service. The full design used one to run fetch-raw and prepare-dem
# when a volume of prepared maps was empty, so custom sites could read terrain.
# This version does not compute custom sites, and data/derived is already in
# the image. Starting the container must not download the NASA maps.
