# No downloads at startup. Prepared maps are optional and read-only.
name: truesouth
services:
  truesouth:
    build: .
    image: ${TRUESOUTH_IMAGE:-truesouth:custom}
    environment:
      TRUESOUTH_DATA_ROOT: /app/data
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${TRUESOUTH_PREPARED_HOST:-./data/prepared}
        target: /app/data/prepared
        read_only: true
      - custom-cache:/app/data/cache
    stop_grace_period: 90s
    restart: unless-stopped
volumes:
  custom-cache:
